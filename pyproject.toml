[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "endpoint-benchmark"
version = "0.1.0"
description = "Zero-runtime-dependency benchmark client for OpenAI-compatible endpoints"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "endpoint-benchmark contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Benchmark",
]

[project.scripts]
endpoint-benchmark = "endpoint_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
